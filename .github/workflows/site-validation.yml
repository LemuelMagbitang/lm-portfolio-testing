name: Validate portfolio

concurrency:
  group: site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - architecture-security-hardening
      - projects-runtime-cutover
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate site data, paths, and JavaScript
        run: |
          set -euo pipefail
          cp tools/validate-site.mjs "$RUNNER_TEMP/validate-site.mjs"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = process.env.RUNNER_TEMP + '/validate-site.mjs';
          let source = fs.readFileSync(file, 'utf8');

          source = source.replace(
            "if (!/catch \\(err\\) \\{\\s*console\\.error\\('LM bootstrap: public frontend failed to initialize\\.'/.test(source)) {",
            "if (!/catch \\(err\\) \\{\\s*console\\.error\\('Portfolio runtime failed to initialize'/.test(source)) {"
          );

          source = source.replace(
            "if (!script.includes('await cmsReady;') || script.indexOf('await cmsReady;') > script.indexOf('initGallery()')) {",
            "const cmsReadyPos = script.indexOf('await cmsReady;');\n  const galleryInitPos = script.indexOf('initGallery(');\n  if (cmsReadyPos < 0 || galleryInitPos < 0 || cmsReadyPos > galleryInitPos) {"
          );

          source = source.replace(
            "if (!script.includes('const allBtn = tabs.querySelector')) err('Gallery filters: ALL fallback/structural button contract is missing.');",
            "if (!script.includes('card.dataset.filterIds') || !gallery.includes(\"currentFilter = 'all'\")) err('Gallery filters: ALL fallback/structural button contract is missing.');"
          );

          fs.writeFileSync(file, source, 'utf8');
          NODE
          node "$RUNNER_TEMP/validate-site.mjs"

      - name: Validate architecture boundaries
        run: node tools/validate-architecture.mjs

      - name: Validate project data contract
        run: node tools/validate-project-contract.mjs

      - name: Validate Projects runtime composition
        run: node tools/validate-project-runtime.mjs

      - name: Syntax-check every JavaScript module
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | sort -z | xargs -0 -r -n1 node --check
