name: Validate portfolio

concurrency:
  group: site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - architecture-security-hardening
      - projects-runtime-cutover
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate site data, paths, and JavaScript
        run: node tools/validate-site.mjs

      - name: Validate architecture boundaries
        run: node tools/validate-architecture.mjs

      - name: Validate project data contract
        run: node tools/validate-project-contract.mjs

      - name: Test Projects loader contract
        run: node tools/test-project-loader.mjs

      - name: Validate site settings contract
        run: node tools/validate-site-settings.mjs

      - name: Validate CMS Projects presentation
        run: node tools/validate-cms-project-presentation.mjs

      - name: Validate Projects runtime composition
        run: node tools/validate-project-runtime.mjs

      - name: Validate Gallery presentation boundary
        run: node tools/validate-gallery-presentation.mjs

      - name: Validate feature lifecycle boundary
        run: node tools/validate-lifecycle.mjs

      - name: Syntax-check every JavaScript module
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | sort -z | xargs -0 -r -n1 node --check

      - name: Syntax-check CMS
        run: node --check admin/admin.js

      - name: Syntax-check smoke test
        run: node --check tools/smoke-browser.mjs

      - name: Browser smoke test
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium
          node tools/smoke-browser.mjs
