name: Validate portfolio

concurrency:
  group: site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - architecture-security-hardening
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate site data, paths, and JavaScript
        run: node tools/validate-site.mjs

      - name: Validate architecture boundaries
        run: node tools/validate-architecture.mjs

      - name: Validate project data contract
        run: node tools/validate-project-contract.mjs

      - name: Syntax-check every JavaScript module
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | sort -z | xargs -0 -r -n1 node --check
