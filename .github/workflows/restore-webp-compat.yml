name: Restore favicon and social preview compatibility

on:
  push:
    branches:
      - projects-runtime-cutover
    paths:
      - .github/workflows/restore-webp-compat.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  restore-validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full active-branch history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: projects-runtime-cutover
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Restore original compatibility-sensitive files
        run: node tools/restore-webp-compat-assets.mjs

      - name: Install browser smoke-test runner
        run: npm install --no-save --ignore-scripts playwright@1.63.0

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium

      - name: Validate site data, paths, and JavaScript
        run: node tools/validate-site.mjs

      - name: Audit asset formats and file sizes
        run: node tools/audit-media-assets.mjs

      - name: Validate architecture boundaries
        run: node tools/validate-architecture.mjs

      - name: Validate project data contract
        run: node tools/validate-project-contract.mjs

      - name: Test Projects loader contract
        run: node tools/test-project-loader.mjs

      - name: Test Curated View resolver
        run: node tools/test-curated-view-resolver.mjs

      - name: Test CMS loader lifecycle contract
        run: node tools/test-cms-loader.mjs

      - name: Test browser script-loader lifecycle contract
        run: node tools/test-script-loader.mjs

      - name: Validate site settings contract
        run: node tools/validate-site-settings.mjs

      - name: Validate contact form fallbacks
        run: node tools/validate-forms.mjs

      - name: Validate CMS Projects presentation
        run: node tools/validate-cms-project-presentation.mjs

      - name: Test CMS path and write safety
        run: node tools/test-cms-path-safety.mjs

      - name: Test CMS atomic-save conflict handling
        run: node tools/test-cms-atomic-save.mjs

      - name: Test CMS Media Library folder rename
        run: node tools/test-cms-media-rename.mjs

      - name: Validate Projects runtime composition
        run: node tools/validate-project-runtime.mjs

      - name: Validate Gallery presentation boundary
        run: node tools/validate-gallery-presentation.mjs

      - name: Validate feature lifecycle boundary
        run: node tools/validate-lifecycle.mjs

      - name: Syntax-check JavaScript and migration utilities
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | sort -z | xargs -0 -r -n1 node --check
          node --check admin/admin.js
          node --check tools/convert-assets-to-webp.mjs
          node --check tools/restore-webp-compat-assets.mjs
          node --check tools/smoke-browser.mjs

      - name: Browser smoke test
        run: node tools/smoke-browser.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - name: Upload prepared Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site

      - name: Commit correction and remove one-time workflow
        run: |
          set -euo pipefail
          rm .github/workflows/restore-webp-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude)package.json' ':(exclude)package-lock.json' ':(exclude)node_modules/**' ':(exclude)_site/**'
          if git diff --cached --quiet; then
            echo "No compatibility correction changes to commit."
          else
            git commit -m "Preserve favicon and social preview source formats"
            git push origin HEAD:refs/heads/projects-runtime-cutover
          fi

  deploy:
    needs: restore-validate-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy corrected portfolio
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
